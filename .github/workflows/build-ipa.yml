name: Build iOS IPA

on:
  push:
    branches: [main, feature/ipad-mouse-support]
  pull_request:
    branches: [main, feature/ipad-mouse-support]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake
          cmake --version

      - name: Configure CMake for iOS (CMake 4 compatible)
        run: |
          cmake -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build with xcodebuild (no signing)
        run: |
          xcodebuild -project build/fallout-ce.xcodeproj \
            -scheme fallout-ce \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            build

      - name: Create IPA
        run: |
          # Find the .app bundle
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in DerivedData"
            find build/DerivedData -maxdepth 6 -type d -name "*.app" || true
            exit 1
          fi

          # Create Payload directory and copy app
          rm -rf Payload fallout-ce.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Create IPA
          /usr/bin/zip -r fallout-ce.ipa Payload

          # Cleanup
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-ios
          path: fallout-ce.ipa
          retention-days: 30
