name: Build iOS IPA

on:
  push:
    branches: [main, feature/ipad-mouse-support]
  pull_request:
    branches: [main, feature/ipad-mouse-support]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (CMake 3)
        run: |
          brew uninstall -f cmake || true
          brew install botantony/cmake3/cmake3
          echo "$(brew --prefix cmake3)/bin" >> $GITHUB_PATH
          cmake3 --version

      - name: Configure CMake for iOS
        run: |
          cmake3 -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build with xcodebuild
        run: |
          xcodebuild -project build/fallout-ce.xcodeproj \
            -scheme fallout-ce \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            build

      - name: Create IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r fallout-ce.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-ios
          path: fallout-ce.ipa
          retention-days: 30
