name: Build iOS IPA

on:
  push:
    branches: [main, feature/ipad-mouse-support]
  pull_request:
    branches: [main, feature/ipad-mouse-support]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake
          cmake --version

      - name: Configure CMake for iOS (CMake 4 compatible)
        run: |
          cmake -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build with xcodebuild (no signing)
        run: |
          xcodebuild -project build/fallout-ce.xcodeproj \
            -scheme fallout-ce \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            build

      - name: Create IPA
        run: |
          set -euo pipefail

          echo "Searching for .app bundle..."
          # The app may end up in build/Release-iphoneos (CMake Xcode generator default)
          # or in DerivedData/Build/Products/Release-iphoneos (xcodebuild default).
          APP_PATH="$(
            find build -type d -name "*.app" \
              \( -path "*Release-iphoneos/*.app" -o -path "*DerivedData*/Build/Products/Release-iphoneos/*.app" \) \
              | head -1
          )"

          echo "Found app at: ${APP_PATH:-<none>}"

          if [ -z "${APP_PATH:-}" ]; then
            echo "ERROR: .app not found. Dumping candidates:"
            find build -type d -name "*.app" -print || true
            echo "Dumping Build products directories:"
            find build -maxdepth 6 -type d -name "Release-iphoneos" -print || true
            exit 1
          fi

          rm -rf Payload fallout-ce.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -r fallout-ce.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-ios
          path: fallout-ce.ipa
          retention-days: 30
